name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Rendering is the slow step, so media is cached on the motion sources.
      - name: Restore rendered media
        id: media
        uses: actions/cache@v4
        with:
          path: public/generated
          key: motion-${{ hashFiles('apps/motion/src/**', 'apps/motion/scripts/render.mjs', 'packages/motion-tokens/src/**', 'apps/web/src/lib/topology.ts', 'apps/web/src/lib/brand.ts', 'apps/web/src/lib/identity-hero.ts', 'pnpm-lock.yaml') }}
      - name: Render Remotion assets
        if: steps.media.outputs.cache-hit != 'true'
        run: |
          pnpm --filter @keshav/motion exec remotion browser ensure
          pnpm motion:render

      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: pnpm build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Validate links
        run: pnpm check:links
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
